<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#107C10;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#grad)"/>

  <text x="640" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">
    Azure Cloud Skills
  </text>
  <text x="640" y="180" font-family="Arial, sans-serif" font-size="32" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    Coursework, labs and projects
  </text>

  <!-- Service badges -->
  <g transform="translate(200, 250)">
